Status: Ready
Title: MolE antimicrobial potential
Description: Scores a compound for growth inhibition across 40 bacterial strains and
  condenses the result into overall and Gram-specific antimicrobial potential scores.
  An XGBoost classifier was fitted over self-supervised MolE embeddings using a public
  screen of 1,197 marketed drugs against those strains. The approach recovered recent
  growth-inhibitory compounds structurally unlike existing antibiotics, and three
  human-targeted drugs predicted as active were confirmed experimentally, giving the
  model direct prospective support.
